<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16141c">
<title>Bir Ömür</title>
<style>:root { color-scheme: dark; --bg: #16141c; --panel: #211e29; --line: #34303e; --text: #e8e2d6; --muted: #a8a0b4; --dim: #77708a; --accent: #e0a050; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#app { max-width: 520px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
h1 { font-size: 30px; margin: 4px 0 6px; letter-spacing: .5px; }
h2 { font-size: 17px; margin: 0 0 8px; color: var(--accent); font-weight: 600; }
p { margin: 6px 0; }
.lead { font-size: 17px; color: var(--text); }
.fine { font-size: 13px; color: var(--muted); }
.src, small { font-size: 11px; color: var(--dim); }
.kicker { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); }
.big-line { font-size: 18px; }
.notice { font-size: 17px; color: var(--accent); background: #2a2333; border-radius: 12px; padding: 10px 12px; }
.btn { width: 100%; border: 0; border-radius: 16px; padding: 16px; font-size: 18px; font-weight: 600; color: #1a1410; background: var(--accent); }
.btn.big { padding: 20px; font-size: 21px; }
.btn.alt { background: #34303e; color: var(--text); font-weight: 500; font-size: 16px; }
.btn:active, .opt:active { transform: scale(.98); }

/* ana ekran ve doğum */
.screen.home, .screen.birth { padding: 24px 18px calc(18px + env(safe-area-inset-bottom)); }
.home-top { margin-top: 12vh; }
.home-bottom { margin-top: auto; display: grid; gap: 10px; padding-top: 16px; }
.archive { margin-top: 20px; background: var(--panel); border-radius: 14px; padding: 12px 14px; }
.arch-row { font-size: 14px; padding: 6px 0; border-top: 1px solid var(--line); }
.arch-row:first-of-type { border-top: 0; }
.arch-row i { display: block; color: var(--muted); font-size: 13px; }
.card { background: var(--panel); border-radius: 16px; padding: 16px; margin-top: 12px; }
.birth .card { margin-top: 14vh; }

/* oyun */
.screen.play { height: 100dvh; min-height: 0; }
.stage { background: #000; display: flex; justify-content: center; flex: none; }
canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
.status { flex: none; padding: 8px 14px 6px; border-bottom: 1px solid var(--line); }
.who { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who span { color: var(--muted); }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 14px; margin-top: 6px; }
.meter { display: grid; grid-template-columns: 70px 1fr; align-items: center; font-size: 12px; color: var(--muted); }
.meter i { height: 6px; background: #2c2836; border-radius: 3px; overflow: hidden; }
.meter b { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .6s; }
.money { font-size: 12px; color: var(--muted); margin-top: 5px; }
.feed { flex: 1; overflow-y: auto; padding: 4px 14px 10px; min-height: 0; }
.year { padding: 8px 0 4px; border-bottom: 1px solid #24212c; }
.year-h { font-size: 12px; color: var(--dim); margin-bottom: 2px; }
.entry { border-left: 3px solid #4a4656; padding: 2px 0 2px 10px; margin: 6px 0; }
.entry p { margin: 0; font-size: 16px; }
.entry.t-iyi { border-color: #6f9e5f; } .entry.t-kotu { border-color: #b97a3e; } .entry.t-onemli { border-color: #d9a94a; } .entry.t-kayip { border-color: #8d3346; }
.fx { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.fx span { font-size: 11px; border-radius: 8px; padding: 1px 7px; background: #2a2632; }
.fx .up { color: #9fd08a; } .fx .down { color: #e39a7a; }
.stat { margin-top: 5px; font-size: 13px; color: var(--muted); background: #1d1a24; border-radius: 10px; padding: 6px 9px; }
.stat small { display: block; margin-top: 2px; }
.decision { flex: none; padding: 12px 14px; background: var(--panel); border-top: 1px solid var(--line); max-height: 58dvh; overflow-y: auto; }
.decision .prompt, .modal .prompt { font-size: 17px; margin: 4px 0 8px; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; flex-direction: column; align-items: flex-start; text-align: left; width: 100%; border: 1px solid #4a4458; background: #2b2735; color: var(--text); border-radius: 14px; padding: 13px 14px; font-size: 16px; min-height: 52px; }
.opt small { margin-top: 2px; color: var(--muted); }
.opt small.lock { color: #d48b6a; }
.opt:disabled { opacity: .55; }
.hidden { display: none !important; }
.controls { flex: none; display: grid; grid-template-columns: repeat(3, 1fr) 56px; gap: 8px; padding: 8px 14px calc(10px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); }
.spd { border: 0; border-radius: 12px; padding: 12px 0; font-size: 17px; background: #2b2735; color: var(--text); }
.spd.on { background: var(--accent); color: #1a1410; font-weight: 700; }
.modal { position: fixed; inset: 0; background: rgba(10, 8, 14, .82); display: flex; align-items: flex-end; justify-content: center; padding: 14px 14px calc(18px + env(safe-area-inset-bottom)); z-index: 5; }
.modal .card { width: 100%; max-width: 492px; display: grid; gap: 8px; }

/* son */
.screen.end { padding: 12px 14px calc(18px + env(safe-area-inset-bottom)); }
.grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.grid i { aspect-ratio: 1; border-radius: 3px; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.moments { margin: 0; padding-left: 18px; font-size: 14px; }
.moments li { margin: 4px 0; }
textarea { width: 100%; min-height: 70px; background: #1d1a24; color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 10px; font: inherit; }
.tag { border: 1px solid #5a5468; background: transparent; color: var(--accent); border-radius: 8px; font-size: 11px; padding: 1px 6px; margin-left: 2px; }
#money-note { margin-top: 4px; }
</style>
</head>
